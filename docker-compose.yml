# GRC Policy Server — Docker Compose (development / default)
#
# OFFLINE MODE (PostgreSQL + local Ollama only — no Qdrant, no Redis):
#   docker compose up postgres
#   COMPARISON_BACKEND=offline uvicorn grc_policy_server.main:app
#
# FULL STACK (Qdrant + Redis + Celery worker):
#   docker compose up
#
# Profiles
#   (no profile)  — postgres + redis + qdrant (full stack)
#   offline       — postgres only
#
# Usage with offline profile:
#   docker compose --profile offline up

services:
  # ── PostgreSQL ─── always required ─────────────────────────────────────────
  postgres:
    container_name: grc_postgres
    image: postgres:17.9
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grc_admin}
      POSTGRES_USER: ${POSTGRES_USER:-grc_admin}
      POSTGRES_DB: ${POSTGRES_DB:-grc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grc_shared_net
    profiles:
      - "" # default (no profile = always starts)
      - offline

  # ── Redis ─── required for Celery (async upload/compare) ───────────────────
  # Not needed when COMPARISON_BACKEND=offline (compare v2 runs synchronously).
  redis:
    container_name: grc_redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - grc_shared_net

  # ── Qdrant ─── optional vector search backend ──────────────────────────────
  # Not required when COMPARISON_BACKEND=offline.
  # ServiceHealthRegistry probes this at /healthz every 30s;
  # if it's unreachable, auto mode degrades to OfflineDiffEngine automatically.
  qdrant:
    container_name: qdrant_vector_db
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - grc_shared_net
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ─── optional knowledge graph (disabled by default) ───────────────
  # Uncomment and set NEO4J_ENABLED=true to enable.
  neo4j:
    container_name: grc_neo4j
    image: neo4j:community-trixie
    volumes:
      - ./neo4j/logs:/logs
      - ./neo4j/config:/config
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}"
      # NEO4J_AUTH: neo4j/password
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_bolt_telemetry_enabled: "false"
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    networks:
      - grc_shared_net

volumes:
  postgres_data:
  qdrant_data:

networks:
  grc_shared_net:
    external: true
