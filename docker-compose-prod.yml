#version: "3.9"

services:
  postgres:
    container_name: grc_postgres
    image: postgres:17.9
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grc_admin}
      POSTGRES_USER: ${POSTGRES_USER:-grc_admin}
      POSTGRES_DB: ${POSTGRES_DB:-grc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grc_shared_net

  redis:
    container_name: grc_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    networks:
      - grc_shared_net

  # neo4j:
  #     container_name: rag_neo4j
  #     image: neo4j:community-trixie
  #     volumes:
  #         - ./neo4j/logs:/logs
  #         - ./neo4j/config:/config
  #         - ./neo4j/data:/data
  #         - ./neo4j/plugins:/plugins
  #     environment:
  #         - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
  #     ports:
  #         - "7474:7474"
  #         - "7687:7687"
  #     restart: always
  #     networks:
  #         - grc_shared_net

  qdrant:
    container_name: qdrant_vector_db
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - grc_shared_net
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
